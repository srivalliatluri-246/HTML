
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h1>Registration form</h1>

    <form>
        <fieldset>
            <legend>User personal information</legend>

            Enter your full name<br>
            <input type="text" name="name" value="mohan"><br>

            Enter your email<br>
            <input type="email" name="email" value="mohan@gmail.com"><br>

            Enter your password<br>
            <input type="password" name="password" value="123456789"><br>

            confirm your password<br>
            <input type="password" name="confirm" value="123456789"><br><br>

            Enter your gender<br>
            <input type="radio" name="gender" value="Male">Male<br>
            <input type="radio" name="gender" value="Female">Female<br>
            <input type="radio" name="gender" value="Others" checked>others<br><br>

            Enter your Address:<br>
            <textarea name="address" rows="3" cols="28"></textarea><br>

            <input type="submit" value="sign-up">

        </fieldset>
    </form>

</body>
</html>
